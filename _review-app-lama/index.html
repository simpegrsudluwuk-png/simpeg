  <!-- ===== TEMPLATE: TAMBAH PEGAWAI ===== -->
  <!-- [BARU] Form multi-section: Biodata (wajib) + Status Kepegawaian (wajib,

  <template id="tpl-tambah">
    <div class="card form-card">
      <h3>Biodata Pegawai Baru</h3>
      <div id="bioFormArea"></div>
    </div>

    <div class="card form-card">
      <h3>Status Kepegawaian <span class="req-mark">*wajib diisi</span></h3>
      <div id="statusFormArea"></div>
    </div>

    <div class="card form-card">
      <h3 class="section-toggle" data-section="pend">
        Pendidikan <span class="opt-mark">(opsional &ndash; isi jika datanya sudah tersedia)</span>
        <span class="chev">&#9656;</span>
      </h3>
      <div class="section-body hidden" id="pendFormArea"></div>
    </div>

    <div class="card form-card">
      <h3 class="section-toggle" data-section="pangkat">

    <div class="card form-card">
      <h3 class="section-toggle" data-section="sipstr">

        <span class="chev">&#9656;</span>
      </h3>
      <div class="section-body hidden" id="sipstrFormArea"></div>
    </div>

    <div class="card">
      <div class="btnrow" style="border-top:none; margin-top:0; padding-top:0;">
        <button class="btn-primary" id="btnSaveNewPegawai">Simpan Pegawai Baru</button>
        <button class="btn-outline" id="btnUpdateTblPegawai">Update Tabel Pegawai</button>
      </div>
      <div class="muted" style="margin-top:10px;">
        "Simpan Pegawai Baru" hanya menyimpan data ke Tbl Bio &amp; sheet riwayat.
        Klik "Update Tabel Pegawai" setelah selesai menyimpan agar pegawai baru
        muncul di Tbl Pegawai, Data Pegawai, Profil, dan Dashboard.
      </div>
    </div>

  <!-- ===== TEMPLATE: INPUT TABEL RIWAYAT ===== -->
  <!-- [BARU] Menu terpisah untuk menambah riwayat (Status/Pend/Pangkat/

       ke halaman Profil satu-satu. Pilih pegawai dulu lewat pencarian,
       lalu isi bagian mana saja yang perlu ditambah (boleh lebih dari
       satu sekaligus), kirim lewat saveRiwayatBulk(). -->
  <template id="tpl-riwayat">
    <div class="card form-card">
      <h3>Pilih Pegawai</h3>
      <div class="field" style="max-width:420px; position:relative;">

      </div>
      <div class="muted" id="rwSelectedInfo" style="margin-top:10px;"></div>
    </div>

    <div id="rwFormWrap" class="hidden">
      <div class="card form-card">
        <h3 class="section-toggle" data-section="rwStatus">
          Status Kepegawaian <span class="opt-mark">(opsional &ndash; isi jika ada perubahan)</span>
          <span class="chev">&#9656;</span>
        </h3>
        <div class="section-body hidden" id="rwStatusFormArea"></div>
      </div>

      <div class="card form-card">
        <h3 class="section-toggle" data-section="rwPend">
          Pendidikan <span class="opt-mark">(opsional)</span>
          <span class="chev">&#9656;</span>
        </h3>
        <div class="section-body hidden" id="rwPendFormArea"></div>
      </div>

      <div class="card form-card">
        <h3 class="section-toggle" data-section="rwPangkat">

          <span class="chev">&#9656;</span>

      </div>

      <div class="card form-card">
        <h3 class="section-toggle" data-section="rwSipstr">
          SIP / STR <span class="opt-mark">(opsional)</span>
          <span class="chev">&#9656;</span>
        </h3>
        <div class="section-body hidden" id="rwSipstrFormArea"></div>
      </div>

      <div class="card form-card">
        <h3 class="section-toggle" data-section="rwKgb">
          KGB (Kenaikan Gaji Berkala) <span class="opt-mark">(opsional)</span>

  <template id="tpl-detail">
    <div class="detail-header card">

  <!-- ===== TEMPLATE: DMS (Dokumen Manajemen Sistem) ===== -->
  <!-- [BARU] Upload, cari, preview & download dokumen PDF per pegawai.
       File disimpan di subfolder Drive per pegawai (link folder utama
       ditentukan di DMS.gs), metadata dicatat di sheet "Tbl Dokumen". -->
  <template id="tpl-dms">
    <div class="card form-card">
      <h3>Pilih Pegawai</h3>
      <div class="field" style="max-width:420px; position:relative;">
        <label>Cari ID Absen atau Nama</label>
        <input type="text" id="dmsPegawaiSearch" autocomplete="off" placeholder="Ketik ID Absen atau nama pegawai...">
        <div id="dmsPegawaiResults" class="search-results hidden" style="top:64px;"></div>
      </div>
      <div class="muted" id="dmsSelectedInfo" style="margin-top:10px;"></div>
    </div>

    <div id="dmsWrap" class="hidden">
      <div class="card">
        <h3>Dokumen Saat Ini</h3>
        <div id="dmsCurrentDoc"></div>
      </div>

      <div class="card form-card">
        <h3>Upload / Ganti Dokumen (PDF)</h3>
        <div class="muted" style="margin-bottom:10px;">
          1 pegawai = 1 file PDF (gabungan seluruh dokumen kepegawaian). Upload baru akan MENGGANTI file sebelumnya.
        </div>
        <div class="field">
          <label>File PDF</label>
          <input type="file" id="dmsFileInput" accept="application/pdf">
        </div>
        <div class="btnrow" style="border-top:none; margin-top:14px; padding-top:0;">
          <button class="btn-primary" id="btnUploadDokumen">Upload Dokumen</button>
        </div>
        <div class="muted" style="margin-top:8px;">Maks 15 MB, hanya file PDF.</div>
      </div>
    </div>
  </template>

  <!-- ===== Modal Preview PDF ===== -->
  <div class="modal-overlay hidden" id="dmsPreviewOverlay">
